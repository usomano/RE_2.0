name: Tune home video opacity

on:
  push:
    paths:
      - '.github/workflows/tune-home-video-opacity.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Increase grid visibility through logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('home-video-test.html')
          s = p.read_text()
          old = "const MATERIAL_OPACITY = 0.96; // subtle grid visibility through the blue material"
          new = "const MATERIAL_OPACITY = 0.88; // clearer grid visibility through the blue material"
          if old not in s:
              raise SystemExit('Expected opacity marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit tuning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-video-test.html
          git commit -m "Increase home video grid visibility"
          git push
