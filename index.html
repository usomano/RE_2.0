  <link rel="preload" href="assets/fonts/Redaction20-Regular.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="assets/fonts/Redaction20-Italic.woff" as="font" type="font/woff" crossorigin>

  <style>
    @font-face{font-family:'Apfel Grotezk Mittel Exact';src:url('assets/fonts/ApfelGrotezk-Mittel.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:'Redaction20 Exact';src:url('assets/fonts/Redaction20-Regular.woff') format('woff');font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:'Redaction20 Exact';src:url('assets/fonts/Redaction20-Italic.woff') format('woff');font-weight:400;font-style:italic;font-display:swap}
    :root{--test-cell:calc(100vw / 16);--test-header-h:var(--test-cell)}
    body.home-video-test{background:var(--bg);background-image:none}
    .plugin-home{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--bg)}
    .plugin-home__video{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
    .plugin-home__video video{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
    /* Shared responsive bands: the wordmark, text and overlay follow one layout. */
    .home-content{position:relative;z-index:2;margin-top:var(--test-header-h);min-height:calc(100dvh - var(--test-header-h));width:100%;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(90px,199fr) minmax(140px,237fr) auto minmax(40px,90fr)}
    .home-content__top{grid-row:1}
    .plugin-home__wordmark{grid-row:2;min-width:0;z-index:2;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .plugin-home__wordmark video{display:block;width:100%;height:100%;object-fit:contain}
    .plugin-home__grid{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
    .plugin-home__grid svg{display:block;width:100%;height:100%}
    .home-content__bottom{grid-row:4}
    @media(min-width:769px){.plugin-home__video video{object-fit:cover;object-position:center 40%}}
    .home-statement{position:relative;grid-row:3;grid-column:1;z-index:5;min-width:0;box-sizing:border-box;margin-left:40.7639%;width:59.2361%;max-width:100%;padding:clamp(22px,3dvh,38px) clamp(18px,2vw,40px) clamp(22px,3dvh,38px) clamp(20px,2vw,36px);color:var(--ink);font-family:'Redaction20 Exact','Redaction20',Georgia,serif;font-size:clamp(20px,min(2.18vw,4.4dvh),36px);line-height:1.1;font-weight:400;font-style:normal;font-synthesis:none;letter-spacing:0;text-align:left;pointer-events:none;-webkit-text-stroke:0 transparent;paint-order:normal;text-shadow:none}
    /* Prevent any previously cached adaptive overlay from duplicating the text. */
    .home-statement em{font-family:'Redaction20 Exact','Redaction20',Georgia,serif;font-style:italic;font-weight:400;font-synthesis:none}
     .home-statement p{margin:0;text-wrap:balance;overflow-wrap:normal}.home-statement p + p{margin-top:1em}.home-statement .keep-together{white-space:nowrap}
    @media(max-width:768px){
      :root{--test-cell:calc(100vw / 13);--test-header-h:calc(var(--test-cell) * 2)}
      .home-content{grid-template-rows:minmax(60px,199fr) minmax(95px,237fr) auto minmax(35px,90fr)}
      .home-statement{margin-left:7%;width:93%;padding:clamp(20px,3dvh,32px) 7% clamp(20px,3dvh,32px) 16px;font-size:clamp(17px,4.6vw,19px);line-height:1.08;text-wrap:balance}
      .home-statement .desktop-break{display:none}
    }
  </style>

<body class="home-video-test">
  <main class="plugin-home" id="main">
    <div class="plugin-home__video" aria-hidden="true">
      <video id="background-video" autoplay muted loop playsinline preload="auto">
        <source src="assets/videos/site-animation-smooth.webm" type="video/webm">
      </video>
    </div>
    <header class="plugin-header">
      <a class="plugin-logo" href="index.html" aria-label="Reincantamento home">
        <img class="plugin-logo__fallback" src="assets/images/REINC-LOGO-2026.svg" alt="" aria-hidden="true">
  <canvas class="plugin-logo__canvas" id="blink-logo" aria-hidden="true"></canvas>
        <video class="plugin-logo__source" id="blink-source" muted playsinline preload="auto" aria-hidden="true"><source src="assets/videos/blink.mp4" type="video/mp4"></video>
      </a>
      <nav class="plugin-nav" aria-label="Primary navigation"><a href="writing/index.html">Drops</a><a href="publishing/index.html">Publishing</a><a href="artworks/index.html">Artworks</a><span>Workshops</span><span>Talks</span></nav>
      <a class="plugin-about" href="about.html">About</a>
      <button class="plugin-menu" id="plugin-menu" type="button" aria-expanded="false" aria-controls="plugin-mobile-panel">Menu</button>
    </header>
    <div class="home-content">
      <div class="home-content__top" aria-hidden="true"></div>
      <div class="plugin-home__wordmark" aria-hidden="true">
        <video id="reincantamento-wordmark" autoplay muted loop playsinline preload="metadata"></video>
      </div>
      <div class="home-statement" aria-label="Reincantamento introduction"><p>Reincantamento is a <em>research</em> and <em>development</em> group exploring technology, politics <span class="keep-together">and spirituality.</span></p><p>We build tools and spaces for collective inquiry.</p></div>
      <div class="home-content__bottom" aria-hidden="true"></div>
      <div class="plugin-home__grid" aria-hidden="true">
        <svg id="responsive-home-grid" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"></svg>
      </div>
    </div>
    <nav class="plugin-mobile-panel" id="plugin-mobile-panel" data-open="false" aria-label="Mobile navigation"><a href="writing/index.html">Drops</a><a href="publishing/index.html">Publishing</a><a href="artworks/index.html">Artworks</a><span>Workshops</span><span>Talks</span><a href="about.html">About</a></nav>
  </main>
  <script>
  (() => {
    const video = document.getElementById('reincantamento-wordmark');
    if (!video) return;
    const isAppleWebKit = /AppleWebKit/i.test(navigator.userAgent) && !/Chrome|Chromium|Edg|OPR/i.test(navigator.userAgent);
    video.src = isAppleWebKit
      ? 'assets/videos/REINCANTAMENTO_SAFARI.mov'
      : 'assets/videos/REINCANTAMENTO_WEB_OPT.webm';
    video.load();
    const playback = video.play();
    if (playback && playback.catch) playback.catch(() => {});
  })();
  </script>
  <script>
  (() => {
    // Draw lines from actual CSS grid band boundaries, not viewport estimates.
    const overlay = document.querySelector('.plugin-home__grid');
    const svg = document.getElementById('responsive-home-grid');
    const bands = ['.home-content__top','.plugin-home__wordmark','.home-statement','.home-content__bottom'].map(sel => document.querySelector(sel));
    if (!overlay || !svg || bands.some(b => !b)) return;
    const ns = 'http://www.w3.org/2000/svg';
    const lines = Array.from({length:7}, () => {
      const line=document.createElementNS(ns,'line');
      line.setAttribute('stroke','#F5F5F5');
      line.setAttribute('stroke-width','1');
      line.setAttribute('vector-effect','non-scaling-stroke');
      svg.appendChild(line);
      return line;
    });
    function setLine(i,x1,y1,x2,y2){
      const l=lines[i];l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
    }
    function layout(){
      const box=overlay.getBoundingClientRect(),w=box.width,h=box.height;
      if(!w||!h)return;
      const mobile=matchMedia('(max-width: 768px)').matches;
      const cols=mobile?13:(w>=1350&&w<1600?13:16);
      const cell=w/cols;
      const y1=bands[0].getBoundingClientRect().bottom-box.top;
      const y2=bands[1].getBoundingClientRect().bottom-box.top;
      const y3=bands[2].getBoundingClientRect().bottom-box.top;
      svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
      setLine(0,3*cell,0,3*cell,y1);
      setLine(1,w-(mobile?2:1)*cell,0,w-(mobile?2:1)*cell,y1);
      setLine(2,0,y1,w,y1);
      setLine(3,0,y2,w,y2);
      const statementEdge=bands[2].getBoundingClientRect().left-box.left;
      setLine(4,statementEdge,y2,statementEdge,y3);
      setLine(5,0,y3,w,y3);
      setLine(6,cell,y3,cell,h);
    }
    if(typeof ResizeObserver!=='undefined'){
      const observer=new ResizeObserver(layout);
      observer.observe(overlay);
      bands.forEach(b=>observer.observe(b));
    }
    window.addEventListener('resize',layout);
    if(document.fonts?.ready)document.fonts.ready.then(layout);
    layout();
  })();
  </script>
  <script src="assets/js/main.js" defer></script>
  <script>(()=>{const video=document.getElementById('background-video');if(video){video.loop=true;video.muted=true;const restart=()=>{try{video.currentTime=0}catch(e){}const p=video.play();if(p&&p.catch)p.catch(()=>{})};video.addEventListener('ended',restart);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&video.paused)restart()})}const menu=document.getElementById('plugin-menu');const panel=document.getElementById('plugin-mobile-panel');if(menu&&panel){menu.addEventListener('click',()=>{const open=menu.getAttribute('aria-expanded')==='true';menu.setAttribute('aria-expanded',String(!open));panel.dataset.open=String(!open)});panel.addEventListener('click',e=>{if(e.target.closest('a')){menu.setAttribute('aria-expanded','false');panel.dataset.open='false'}})}})();</script>
  <script src="assets/js/header.js?v=logo-fallback-5" defer></script>
