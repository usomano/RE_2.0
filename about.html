<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REINCANTAMENTO — About</title>
    <meta name="description" content="Reincantamento is a research and publishing collective exploring technology, radical imagination, and rituality.">

    <!-- Open Graph -->
    <meta property="og:title" content="REINCANTAMENTO — About">
    <meta property="og:description" content="A research and publishing collective exploring technology, radical imagination, and rituality.">
    <meta property="og:type" content="website">

    <link rel="icon" href="assets/images/REINC-LOGO.svg" type="image/svg+xml">
    <link rel="icon" href="assets/images/reinc-eye-nero.png" type="image/png"><!-- fallback -->

    <!-- Preload the nav font (Apfel Grotezk Mittel) — used in the above-the-fold header -->
    <link rel="preload" href="assets/fonts/ApfelGrotezk-Mittel.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="assets/css/styles.css">

    <!-- Not deferred: applies the stored palette before first paint. -->
    <script src="assets/js/theme.js"></script>
</head>
<body class="theme-blue">

    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
        <a class="brand" href="index.html" aria-label="Reincantamento home">
            <img src="assets/images/LOGO-gray.png" alt="Reincantamento" width="53" height="25">
        </a>

        <button class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="primary-nav">
            <span></span><span></span><span></span>
        </button>

        <nav class="main-nav" id="primary-nav" aria-label="Primary">
            <div class="nav-item">
                <a href="writing/index.html">Writings</a>
                <div class="nav-menu">
                    <a href="writing/index.html">Drops</a>
                    <a href="writing/archive.html">Archive</a>
                </div>
            </div>
            <a href="publishing/index.html">Publishing</a>
            <a href="artworks/index.html">Artworks</a>
            <!-- No design yet — shown, not linked. -->
            <span class="nav-off">Workshops</span>
            <span class="nav-off">Talks</span>
        </nav>

        <a class="about-btn is-active" href="about.html" aria-current="page">About</a>
    </header>

    <main class="hero" id="main" tabindex="-1">
        <div class="statement">
            <p>Reincantamento is a<br>
            ✦ Research &amp; Publishing Group<br>
            exploring Technology, Radical<br>
            Imagination, and Rituals</p>
        </div>
    </main>

    <!-- Same grid-aligned media layer as the home page (gif in the bottom-left cell). -->
    <div class="grid-layer" aria-hidden="true">
        <figure class="media-cell" style="grid-column: 1; grid-row: -2 / -1;">
            <video class="media" autoplay muted loop playsinline>
                <source src="assets/images/metaphor.mp4" type="video/mp4">
            </video>
        </figure>
    </div>

    <!-- The colourway switch is a cell of its own: bottom right of the first
         screen, under the ABOUT cell at the top of the same column. -->
    <button class="theme-switch" type="button" aria-pressed="false" aria-label="Acid mode" title="Acid mode">&#9791;</button>

    <script src="assets/js/main.js" defer></script>
</body>
</html>
