<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>REINCANTAMENTO — Home Video Test</title>
  <meta name="description" content="REINCANTAMENTO home animation layout test.">
  <link rel="icon" href="assets/images/REINC-LOGO.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/ApfelGrotezk-Mittel.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    :root {
      --test-bg: #d9d9d9;
      --test-blue: #0009ff;
      --test-white: #fff;
      --test-desktop-cell: 90px;
      --test-mobile-cell: 30px;
    }

    html, body { margin: 0; }
    body.home-animation-test {
      background: var(--test-bg);
      background-image: none;
      overflow-x: hidden;
    }

    /* New header approved in Figma: 16 × 90 desktop grid. */
    .test-header {
      position: relative;
      z-index: 20;
      height: var(--test-desktop-cell);
      background-color: var(--test-bg);
      background-image:
        repeating-linear-gradient(to right, rgba(255,255,255,.9) 0, rgba(255,255,255,.9) 1px, transparent 1px, transparent var(--test-desktop-cell)),
        linear-gradient(to bottom, transparent calc(100% - 1px), rgba(255,255,255,.9) calc(100% - 1px));
      font-family: var(--font-menu, 'Apfel Grotezk', Arial, sans-serif);
    }

    .test-brand {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--test-desktop-cell);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .test-brand img { width: 44px; height: auto; display: block; }

    .test-desktop-nav {
      position: absolute;
      right: calc(var(--test-desktop-cell) * 2);
      top: 0;
      height: var(--test-desktop-cell);
      display: grid;
      grid-template-columns: repeat(5, var(--test-desktop-cell));
    }
    .test-desktop-nav a,
    .test-desktop-nav span,
    .test-about,
    .test-menu-button {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-menu, 'Apfel Grotezk', Arial, sans-serif);
      font-size: 11px;
      line-height: 1;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: uppercase;
      text-decoration: none;
    }
    .test-desktop-nav a,
    .test-desktop-nav span { color: var(--test-blue); }

    .test-about {
      position: absolute;
      right: 0;
      top: 0;
      width: var(--test-desktop-cell);
      height: var(--test-desktop-cell);
      background: var(--test-blue);
      color: var(--test-white);
    }

    .test-menu-button,
    .test-mobile-nav { display: none; }

    /* Video occupies the complete first screen below the header. */
    .animation-hero {
      position: relative;
      height: calc(100dvh - var(--test-desktop-cell));
      min-height: 420px;
      overflow: hidden;
      background: var(--test-bg);
    }
    .animation-hero video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transform: scale(1.01);
    }
    .animation-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(to right, rgba(255,255,255,.72) 0, rgba(255,255,255,.72) 1px, transparent 1px, transparent var(--test-desktop-cell)),
        repeating-linear-gradient(to bottom, rgba(255,255,255,.72) 0, rgba(255,255,255,.72) 1px, transparent 1px, transparent var(--test-desktop-cell));
    }

    /* Keep the existing footer below the one-screen home composition. */
    .home-animation-test .site-footer { margin-top: 0; }

    @media (max-width: 768px) {
      .test-header {
        height: 60px;
        background-image:
          repeating-linear-gradient(to right, rgba(255,255,255,.9) 0, rgba(255,255,255,.9) .5px, transparent .5px, transparent var(--test-mobile-cell)),
          repeating-linear-gradient(to bottom, rgba(255,255,255,.9) 0, rgba(255,255,255,.9) .5px, transparent .5px, transparent var(--test-mobile-cell));
      }
      .test-brand { width: 60px; }
      .test-brand img { width: 36px; }
      .test-desktop-nav, .test-about { display: none; }
      .test-menu-button {
        position: absolute;
        display: flex;
        right: 0;
        top: 0;
        width: 60px;
        height: 60px;
        padding: 0;
        border: 0;
        background: var(--test-blue);
        color: var(--test-white);
        cursor: pointer;
        font-size: 12px;
      }
      .test-mobile-nav {
        position: fixed;
        z-index: 30;
        top: 60px;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 30px;
        background: var(--test-bg);
        flex-direction: column;
        align-items: flex-start;
        gap: 24px;
      }
      .test-mobile-nav[data-open="true"] { display: flex; }
      .test-mobile-nav a,
      .test-mobile-nav span {
        color: var(--test-blue);
        font-family: var(--font-menu, 'Apfel Grotezk', Arial, sans-serif);
        font-size: 20px;
        font-weight: 500;
        text-transform: uppercase;
        text-decoration: none;
      }
      .animation-hero {
        height: calc(100dvh - 60px);
        min-height: 360px;
      }
      .animation-grid {
        background-image:
          repeating-linear-gradient(to right, rgba(255,255,255,.72) 0, rgba(255,255,255,.72) .5px, transparent .5px, transparent var(--test-mobile-cell)),
          repeating-linear-gradient(to bottom, rgba(255,255,255,.72) 0, rgba(255,255,255,.72) .5px, transparent .5px, transparent var(--test-mobile-cell));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .animation-hero video { animation: none; }
    }
  </style>
</head>
<body class="home-animation-test">
  <header class="test-header">
    <a class="test-brand" href="index.html" aria-label="Reincantamento home">
      <img src="assets/images/REINC-LOGO.svg" alt="Reincantamento">
    </a>

    <nav class="test-desktop-nav" aria-label="Primary navigation">
      <a href="writing/index.html">Writings</a>
      <a href="publishing/index.html">Publishing</a>
      <a href="artworks/index.html">Artworks</a>
      <span>Workshops</span>
      <span>Talks</span>
    </nav>

    <a class="test-about" href="about.html">About</a>

    <button class="test-menu-button" id="test-menu-button" type="button" aria-expanded="false" aria-controls="test-mobile-nav">Menu</button>
  </header>

  <nav class="test-mobile-nav" id="test-mobile-nav" data-open="false" aria-label="Mobile navigation">
    <a href="writing/index.html">Writings</a>
    <a href="publishing/index.html">Publishing</a>
    <a href="artworks/index.html">Artworks</a>
    <span>Workshops</span>
    <span>Talks</span>
    <a href="about.html">About</a>
  </nav>

  <main class="animation-hero" id="main">
    <video autoplay muted loop playsinline preload="auto" aria-label="REINCANTAMENTO home animation">
      <source src="assets/videos/site-animation-smooth.mp4" type="video/mp4">
    </video>
    <div class="animation-grid" aria-hidden="true"></div>
  </main>

  <footer class="site-footer site-footer--flush">
    <p class="site-footer__mark">REINCANTAMENTO</p>
    <div class="footer-cols">
      <form class="newsletter" action="https://reincantamentox.substack.com/subscribe" method="get" target="_blank">
        <label class="newsletter__label" for="nl-email">Subscribe to drops</label>
        <div class="newsletter__field">
          <input id="nl-email" type="email" name="email" placeholder="your@email.com" autocomplete="email">
          <button type="submit" aria-label="Subscribe">&#8594;</button>
        </div>
      </form>
      <nav class="footer-social" aria-label="Nodes">
        <a href="mailto:reincantamento@proton.me">Email</a>
        <a href="https://www.instagram.com/re.incantamento/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://t.me/+C1fjM6yVcdJmYzI0" target="_blank" rel="noopener">Telegram</a>
        <a href="https://reincantamentox.substack.com/" target="_blank" rel="noopener">Newsletter</a>
        <a href="https://www.are.na/reincantamento/channels/" target="_blank" rel="noopener">Are.na</a>
      </nav>
    </div>
    <div class="footer-bottom">
      <p>2026 Reincantamento &nbsp;&#183;&nbsp; Berlin / Turin / Venice</p>
      <div class="footer-legal"><a href="about.html">About</a></div>
    </div>
  </footer>

  <script>
    (() => {
      const button = document.getElementById('test-menu-button');
      const nav = document.getElementById('test-mobile-nav');
      if (!button || !nav) return;
      button.addEventListener('click', () => {
        const open = button.getAttribute('aria-expanded') === 'true';
        button.setAttribute('aria-expanded', String(!open));
        nav.dataset.open = String(!open);
      });
      nav.addEventListener('click', (event) => {
        if (event.target.closest('a')) {
          button.setAttribute('aria-expanded', 'false');
          nav.dataset.open = 'false';
        }
      });
    })();
  </script>
</body>
</html>
