<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>REINCANTAMENTO — Home Video Test</title>
    <meta name="description" content="REINCANTAMENTO home background video test.">

    <link rel="icon" href="assets/images/REINC-LOGO.svg" type="image/svg+xml">
    <link rel="icon" href="assets/images/reinc-eye-nero.png" type="image/png">
    <link rel="preload" href="assets/fonts/ApfelGrotezk-Mittel.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/css/styles.css">

    <style>
        /* Test-only layout. The header markup and behaviour are exactly the same
           as the production home; only the empty home field is replaced by the
           supplied moving background. */
        .home-video-test .video-hero {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .home-video-test .video-layer {
            position: absolute;
            top: var(--grid-row);
            right: 0;
            bottom: 0;
            left: 0;
            overflow: hidden;
            background: var(--bg);
        }

        .home-video-test .video-layer video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center center;
        }

        /* The same site grid remains visible on top of the movie. Because the
           movie starts exactly one --grid-row from the document origin, these
           lines continue the header grid without an offset. */
        .home-video-test .video-grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                repeating-linear-gradient(to right, var(--line) 0, var(--line) 1px, transparent 1px, transparent var(--grid-col)),
                repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent var(--grid-row));
        }

        .home-video-test .site-footer {
            margin-top: 0;
        }

        @media (max-width: 768px) {
            .home-video-test .video-grid {
                background-image:
                    repeating-linear-gradient(to right, var(--line) 0, var(--line) .5px, transparent .5px, transparent var(--grid-col)),
                    repeating-linear-gradient(to bottom, var(--line) 0, var(--line) .5px, transparent .5px, transparent var(--grid-row));
            }
        }
    </style>
</head>
<body class="home-video-test">

    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Production site header: same markup/classes as index.html. -->
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="Reincantamento home">
            <img src="assets/images/REINC-LOGO.svg" alt="Reincantamento" width="53" height="25">
        </a>

        <button class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="primary-nav">
            <span></span><span></span><span></span>
        </button>

        <nav class="main-nav" id="primary-nav" aria-label="Primary">
            <div class="nav-item">
                <a href="writing/index.html">Writings</a>
                <div class="nav-menu">
                    <a href="writing/index.html">Drops</a>
                    <a href="writing/archive.html">Archive</a>
                </div>
            </div>
            <a href="publishing/index.html">Publishing</a>
            <a href="artworks/index.html">Artworks</a>
            <span class="nav-off">Workshops</span>
            <span class="nav-off">Talks</span>
        </nav>

        <a class="about-btn" href="about.html">About</a>
    </header>

    <main class="video-hero" id="main" tabindex="-1">
        <div class="video-layer">
            <video autoplay muted loop playsinline preload="auto" aria-label="REINCANTAMENTO home animation">
                <source src="assets/videos/site-animation-smooth.mp4" type="video/mp4">
            </video>
            <div class="video-grid" aria-hidden="true"></div>
        </div>
    </main>

    <footer class="site-footer site-footer--flush">
        <p class="site-footer__mark">REINCANTAMENTO</p>

        <div class="footer-cols">
            <form class="newsletter" action="https://reincantamentox.substack.com/subscribe" method="get" target="_blank">
                <label class="newsletter__label" for="nl-email">Subscribe to drops</label>
                <div class="newsletter__field">
                    <input id="nl-email" type="email" name="email" placeholder="your@email.com" autocomplete="email">
                    <button type="submit" aria-label="Subscribe">&#8594;</button>
                </div>
            </form>

            <nav class="footer-social" aria-label="Nodes">
                <a href="mailto:reincantamento@proton.me">Email</a>
                <a href="https://www.instagram.com/re.incantamento/" target="_blank" rel="noopener">Instagram</a>
                <a href="https://t.me/+C1fjM6yVcdJmYzI0" target="_blank" rel="noopener">Telegram</a>
                <a href="https://reincantamentox.substack.com/" target="_blank" rel="noopener">Newsletter</a>
                <a href="https://www.are.na/reincantamento/channels/" target="_blank" rel="noopener">Are.na</a>
            </nav>
        </div>

        <div class="footer-bottom">
            <p>2026 Reincantamento &nbsp;&#183;&nbsp; Berlin / Turin / Venice</p>
            <div class="footer-legal">
                <a href="about.html">About</a>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js" defer></script>
</body>
</html>
