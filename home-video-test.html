  <script>
  (() => {
    // Draw lines from actual CSS grid band boundaries, not viewport estimates.
    const overlay = document.querySelector('.plugin-home__grid');
    const svg = document.getElementById('responsive-home-grid');
    const bands = ['.home-content__top','.plugin-home__wordmark','.home-statement','.home-content__bottom'].map(sel => document.querySelector(sel));
    if (!overlay || !svg || bands.some(b => !b)) return;
    const ns = 'http://www.w3.org/2000/svg';
    const lines = Array.from({length:7}, () => {
      const line=document.createElementNS(ns,'line');
      line.setAttribute('stroke','#F5F5F5');
      line.setAttribute('stroke-width','1');
      line.setAttribute('vector-effect','non-scaling-stroke');
      svg.appendChild(line);
      return line;
    });
    function setLine(i,x1,y1,x2,y2){
      const l=lines[i];l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
    }
    function layout(){
      const box=overlay.getBoundingClientRect(),w=box.width,h=box.height;
      if(!w||!h)return;
      const mobile=matchMedia('(max-width: 768px)').matches;
      const cell=w/(mobile?13:16);
      const y1=bands[0].getBoundingClientRect().bottom-box.top;
      const y2=bands[1].getBoundingClientRect().bottom-box.top;
      const y3=bands[2].getBoundingClientRect().bottom-box.top;
      svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
      setLine(0,3*cell,0,3*cell,y1);
      setLine(1,w-(mobile?2:1)*cell,0,w-(mobile?2:1)*cell,y1);
      setLine(2,0,y1,w,y1);
      setLine(3,0,y2,w,y2);
      setLine(4,w*587/1440,y2,w*587/1440,y3);
      setLine(5,0,y3,w,y3);
      setLine(6,cell,y3,cell,h);
    }
    if(typeof ResizeObserver!=='undefined'){
      const observer=new ResizeObserver(layout);
      observer.observe(overlay);
      bands.forEach(b=>observer.observe(b));
    }
    window.addEventListener('resize',layout);
    if(document.fonts?.ready)document.fonts.ready.then(layout);
    layout();
  })();
  </script>

  <script>
  (() => {
    const video = document.getElementById('blink-source');
    const canvas = document.getElementById('blink-logo');
    if (!video || !canvas) return;
    const ctx = canvas.getContext('2d', { alpha: true });
    if (!ctx) return;

    const scratch = document.createElement('canvas');
    const sourceCtx = scratch.getContext('2d', { willReadFrequently: true });
    if (!sourceCtx) return;

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let timeoutId = 0;
    let frameId = 0;
    let playing = false;

    function renderFrame() {
      if (video.readyState < 2 || !video.videoWidth || !video.videoHeight) return;
      // More than enough resolution for the small header mark, without
      // processing a full-size video frame on every blink.
      const w = Math.min(320, video.videoWidth);
      const h = Math.max(1, Math.round(video.videoHeight * w / video.videoWidth));
      if (scratch.width !== w || scratch.height !== h) {
        scratch.width = canvas.width = w;
        scratch.height = canvas.height = h;
      }
      sourceCtx.drawImage(video, 0, 0, w, h);
      const frame = sourceCtx.getImageData(0, 0, w, h);
      const pixels = frame.data;
      // A flat opaque video background is keyed against four sampled corners.
      // Soft alpha edges preserve anti-aliasing around the moving symbol.
      const corners = [0, (w - 1) * 4, ((h - 1) * w) * 4, (w * h - 1) * 4];
      const bg = [0, 0, 0];
      for (const offset of corners) {
        for (let c = 0; c < 3; c++) bg[c] += pixels[offset + c] / 4;
      }
      for (let i = 0; i < pixels.length; i += 4) {
        const dr = pixels[i] - bg[0];
        const dg = pixels[i + 1] - bg[1];
        const db = pixels[i + 2] - bg[2];
        const distance = Math.sqrt(dr * dr + dg * dg + db * db);
        const alpha = Math.max(0, Math.min(1, (distance - 9) / 48));
        if (alpha < 0.005) {
          pixels[i + 3] = 0;
        } else {
          // Recover the original foreground color from its background blend.
          for (let c = 0; c < 3; c++) {
            pixels[i + c] = Math.max(0, Math.min(255,
              (pixels[i + c] - (1 - alpha) * bg[c]) / alpha));
          }
          pixels[i + 3] = Math.round(255 * alpha);
        }
      }
      ctx.clearRect(0, 0, w, h);
      ctx.putImageData(frame, 0, 0);
    }

    function onFrame() {
      renderFrame();
      if (playing && video.requestVideoFrameCallback) {
        frameId = video.requestVideoFrameCallback(onFrame);
      }
    }

    function stopFrameTracking() {
      playing = false;
      if (frameId && video.cancelVideoFrameCallback) {
        video.cancelVideoFrameCallback(frameId);
        frameId = 0;
      }
    }

    function scheduleBlink() {
      clearTimeout(timeoutId);
      if (reducedMotion.matches || document.hidden) return;
      // Random rest between single blinks, rather than a regular video loop.
      timeoutId = setTimeout(() => {
        if (document.hidden || reducedMotion.matches) return;
        video.currentTime = 0;
        const attempt = video.play();
        if (attempt && attempt.catch) attempt.catch(() => scheduleBlink());
      }, 1800 + Math.random() * 5600);
    }

    video.addEventListener('loadeddata', () => {
      video.pause();
      renderFrame();
      scheduleBlink();
    }, { once: true });
    video.addEventListener('seeked', renderFrame);
    video.addEventListener('play', () => {
      stopFrameTracking();
      playing = true;
      if (video.requestVideoFrameCallback) {
        frameId = video.requestVideoFrameCallback(onFrame);
      } else {
        const fallback = () => {
          if (!playing) return;
          renderFrame();
          frameId = requestAnimationFrame(fallback);
        };
        frameId = requestAnimationFrame(fallback);
      }
    });
    video.addEventListener('ended', () => {
      stopFrameTracking();
      video.currentTime = 0;
      scheduleBlink();
    });
    document.addEventListener('visibilitychange', () => {
      clearTimeout(timeoutId);
      if (document.hidden) {
        video.pause();
        stopFrameTracking();
      } else {
        video.currentTime = 0;
        scheduleBlink();
      }
    });
    reducedMotion.addEventListener?.('change', () => {
      clearTimeout(timeoutId);
      if (reducedMotion.matches) {
        video.pause();
        stopFrameTracking();
        video.currentTime = 0;
      } else scheduleBlink();
    });
    if (video.readyState >= 2) {
      video.pause();
      renderFrame();
      scheduleBlink();
    }
  })();
  </script>
